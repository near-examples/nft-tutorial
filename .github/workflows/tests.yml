name: Tests
on:
  repository_dispatch:
    types: [tests-report]
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    name: Unit tests
    strategy:
      matrix:
        platform: [ubuntu-latest]  # , windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install contract build tooling
        run: cargo install cargo-near --version 0.21.1 --locked --no-default-features
      - name: Run integration test
        run: cd integration-tests && cargo run --locked --example integration-tests
      - name: Market tests
        run: cd market-contract && cargo test --locked
      - name: Contract Basics tests
        run: cd nft-contract-basic && cargo test --locked
      - name: Events tests
        run: cd nft-contract-events && cargo test --locked
      - name: Royalty tests
        run: cd nft-contract-royalty && cargo test --locked
      - name: Skeleton tests
        run: cd nft-contract-skeleton && cargo test --locked
      - name: NFT series tests
        run: cd nft-series && cargo test --locked

  contract-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        contract: [nft-contract-skeleton, nft-contract-basic, nft-contract-events, nft-contract-approval, nft-contract-royalty, nft-series, market-contract]
    defaults:
      run:
        working-directory: ${{ matrix.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install contract build tooling
        run: cargo install cargo-near --version 0.21.1 --locked --no-default-features
      - run: cargo test --lib --locked
      - run: cargo near build non-reproducible-wasm --no-abi --no-embed-abi
